name: java ci

on:
  workflow_dispatch:

env:
  java_version: 17
  project_dir: ./complete
  docker_image: spring-app
  docker_hub_username: syedsalmann
  docker_tag: latest
  

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: ${{ env.java_version }}
          cache: 'maven'

      - name: maven tests
        working-directory: ${{ env.project_dir }}
        run: mvn test

      - name: maven build
        working-directory: ${{ env.project_dir }}
        run: mvn package -DskipTests

      - name: verify build
        working-directory: ${{ env.project_dir }}
        run: test -f target/*.jar

      - name: build docker image
        working-directory: ${{ env.project_dir }}
        run: docker build -t ${{ env.docker_hub_username }}/${{ env.docker_image }}:${{ env.docker_tag }} .

      - name: verify docker image
        run: docker images ${{ env.docker_hub_username }}/${{ env.docker_image }}:${{ env.docker_tag }}

      - name: login to docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: push docker image
        run: docker push ${{ env.docker_hub_username }}/${{ env.docker_image }}:${{ env.docker_tag }}
